<h1>棋王 ROM AI &nbsp;vs&nbsp; Pikafish (10 ms, 1T)</h1>

 "rom", "engname": "ROM runtime depth 6", "text": "将 e9-d9", "score": 28, "t": 8.966, "depth": 6, "book": false}, {"frm": 12, "to": 21, "side": "R", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "车 b0-b9", "score": 654, "t": 0.011, "depth": 9, "book": false}, {"frm": 45, "to": 44, "side": "B", "eng": "rom", "engname": "ROM runtime depth 7", "text": "将 d9-d8", "score": 25, "t": 50.159, "depth": 7, "book": false}, {"frm": 9, "to": 69, "side": "R", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "炮 a9xf9 (士)", "score": 705, "t": 0.011, "depth": 9, "book": false}, {"frm": 55, "to": 91, "side": "B", "eng": "rom", "engname": "ROM runtime depth 6", "text": "砲 e7-h7", "score": -11, "t": 12.196, "depth": 6, "book": false}, {"frm": 92, "to": 91, "side": "R", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "车 h8xh7 (砲)", "score": 644, "t": 0.013, "depth": 9, "book": false}, {"frm": 93, "to": 79, "side": "B", "eng": "rom", "engname": "ROM runtime depth 6", "text": "馬 h9-g7", "score": -130, "t": 54.222, "depth": 6, "book": false}, {"frm": 21, "to": 20, "side": "R", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "车 b9-b8", "score": 676, "t": 0.01, "depth": 10, "book": false}, {"frm": 44, "to": 45, "side": "B", "eng": "rom", "engname": "ROM runtime depth 7", "text": "将 d8-d9", "score": -121, "t": 33.02, "depth": 7, "book": false}, {"frm": 69, "to": 105, "side": "R", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "炮 f9xi9 (車)", "score": 773, "t": 0.012, "depth": 10, "book": false}, {"frm": 56, "to": 69, "side": "B", "eng": "rom", "engname": "ROM runtime depth 7", "text": "士 e8-f9", "score": -342, "t": 54.904, "depth": 7, "book": false}, {"frm": 91, "to": 79, "side": "R", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "车 h7xg7 (馬)", "score": 791, "t": 0.01, "depth": 10, "book": false}, {"frm": 74, "to": 38, "side": "B", "eng": "rom", "engname": "ROM runtime depth 6", "text": "車 g2-d2", "score": -449, "t": 17.832, "depth": 6, "book": false}, {"frm": 79, "to": 31, "side": "R", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "车 g7xc7 (砲)", "score": 1020, "t": 0.011, "depth": 8, "book": false}, {"frm": 45, "to": 57, "side": "B", "eng": "rom", "engname": "ROM runtime depth 6", "text": "将 d9-e9", "score": -557, "t": 6.396, "depth": 6, "book": false}, {"frm": 31, "to": 32, "side": "R", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "车 c7-c8", "score": 1070, "t": 0.011, "depth": 4, "book": false}, {"frm": 29, "to": 28, "side": "B", "eng": "rom", "engname": "ROM runtime depth 6", "text": "卒 c5-c4", "score": -556, "t": 17.77, "depth": 6, "book": false}, {"frm": 32, "to": 56, "side": "R", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "车 c8-e8", "score": 1078, "t": 0.01, "depth": 2, "book": false}, {"frm": 57, "to": 45, "side": "B", "eng": "rom", "engname": "ROM runtime depth 7", "text": "将 e9-d9", "score": -542, "t": 0.002, "depth": 7, "book": false}, {"frm": 20, "to": 21, "side": "R", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "车 b8-b9", "score": 1078, "t": 0.01, "depth": 2, "book": false}, {"frm": 7, "to": 33, "side": "B", "eng": "rom", "engname": "ROM runtime depth 7", "text": "象 a7-c9", "score": -542, "t": 0.003, "depth": 7, "book": false}, {"frm": 21, "to": 33, "side": "R", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "车 b9xc9 (象)", "score": 1078, "t": 0.01, "depth": 2, "book": false}], START={"48": [1, 0], "96": [4, 0], "0": [4, 0], "86": [6, 0], "14": [6, 0], "84": [5, 0], "12": [5, 0], "60": [2, 0], "36": [2, 0], "72": [3, 0], "24": [3, 0], "99": [7, 0], "75": [7, 0], "51": [7, 0], "27": [7, 0], "3": [7, 0], "57": [1, 1], "105": [4, 1], "9": [4, 1], "91": [6, 1], "19": [6, 1], "93": [5, 1], "21": [5, 1], "69": [2, 1], "45": [2, 1], "81": [3, 1], "33": [3, 1], "102": [7, 1], "78": [7, 1], "54": [7, 1], "30": [7, 1], "6": [7, 1]}, RESULT="pikafish wins: checkmate";
const CN={1:'\u5e05',2:'\u4ed5',3:'\u76f8',4:'\u8f66',5:'\u9a6c',6:'\u70ae',7:'\u5175'};
const CNB={1:'\u5c06',2:'\u58eb',3:'\u8c61',4:'\u8eca',5:'\u99ac',6:'\u7832',7:'\u5352'};
const M=30, CELL=48, cv=document.getElementById('cv'), cx=cv.getContext('2d');
let idx=0, timer=null;

function boardAt(n){
  let b=JSON.parse(JSON.stringify(START));
  for(let i=0;i<n;i++){const m=MOVES[i]; b[m.to]=b[m.frm]; delete b[m.frm];}
  return b;
}
function xy(pos){return [M+Math.floor(pos/12)*CELL, M+(9-(pos%12))*CELL];}

function draw(){
  const b=boardAt(idx);
  cx.fillStyle='#f0d9a7';cx.fillRect(0,0,cv.width,cv.height);
  cx.strokeStyle='#7a5c33';cx.lineWidth=1;
  for(let r=0;r<10;r++){cx.beginPath();cx.moveTo(M,M+r*CELL);
    cx.lineTo(M+8*CELL,M+r*CELL);cx.stroke();}
  for(let f=0;f<9;f++){
    if(f===0||f===8){cx.beginPath();cx.moveTo(M+f*CELL,M);
      cx.lineTo(M+f*CELL,M+9*CELL);cx.stroke();}
    else{cx.beginPath();cx.moveTo(M+f*CELL,M);cx.lineTo(M+f*CELL,M+4*CELL);cx.stroke();
      cx.beginPath();cx.moveTo(M+f*CELL,M+5*CELL);cx.lineTo(M+f*CELL,M+9*CELL);cx.stroke();}}
  cx.beginPath();cx.moveTo(M+3*CELL,M);cx.lineTo(M+5*CELL,M+2*CELL);
  cx.moveTo(M+5*CELL,M);cx.lineTo(M+3*CELL,M+2*CELL);
  cx.moveTo(M+3*CELL,M+7*CELL);cx.lineTo(M+5*CELL,M+9*CELL);
  cx.moveTo(M+5*CELL,M+7*CELL);cx.lineTo(M+3*CELL,M+9*CELL);cx.stroke();
  cx.fillStyle='#8a6a3d';cx.font='16px serif';cx.textAlign='center';
  cx.fillText('\u695a\u6cb3          \u6f22\u754c', M+4*CELL, M+4.6*CELL);

  if(idx>0){const m=MOVES[idx-1];
    for(const p of [m.frm,m.to]){const [x,y]=xy(p);
      cx.fillStyle='rgba(255,200,0,.45)';cx.beginPath();
      cx.arc(x,y,CELL*0.44,0,7);cx.fill();}}

  for(const k in b){const [t,s]=b[k], [x,y]=xy(+k);
    cx.beginPath();cx.arc(x,y,CELL*0.40,0,7);
    cx.fillStyle=s===0?'#fff4e0':'#3b3b3b';cx.fill();
    cx.lineWidth=2;cx.strokeStyle=s===0?'#c0392b':'#1a1a1a';cx.stroke();
    cx.fillStyle=s===0?'#c0392b':'#7fb3ff';
    cx.font='bold 24px "PingFang SC","Microsoft YaHei",serif';
    cx.textBaseline='middle';cx.fillText(s===0?CN[t]:CNB[t],x,y+1);}

  document.getElementById('sl').value=idx;
  const st=document.getElementById('st');
  if(idx===0) st.textContent='\u521d\u59cb\u5c40\u9762';
  else{const m=MOVES[idx-1];
    st.innerHTML=`<span class="badge ${m.eng==='rom'?'rom':'mod'}">${m.engname}</span> `+
      `<b>${m.text}</b> &nbsp;<span style="color:#9aa0a6">${m.score} · ${m.t}s</span>`;}
  if(idx===MOVES.length&&RESULT) st.innerHTML+=`<br><b>${RESULT}</b>`;
  document.querySelectorAll('#tb tr').forEach((r,i)=>
    r.className=(i===idx-1)?'on':'');
  const cur=document.querySelector('#tb tr.on'); if(cur) cur.scrollIntoView({block:'nearest'});
}
function go(n){idx=Math.max(0,Math.min(MOVES.length,n));draw();}
function step(d){go(idx+d);}
function play(){
  const btn=document.getElementById('pp');
  if(timer){clearInterval(timer);timer=null;btn.textContent='\u25b6 \u64ad\u653e';return;}
  btn.textContent='\u23f8 \u6682\u505c';
  timer=setInterval(()=>{if(idx>=MOVES.length){clearInterval(timer);timer=null;
    btn.textContent='\u25b6 \u64ad\u653e';}else step(1);},750);
}
const tb=document.getElementById('tb');
MOVES.forEach((m,i)=>{const tr=document.createElement('tr');
  tr.onclick=()=>go(i+1);
  tr.innerHTML=`<td>${i+1}</td><td class="${m.side==='R'?'r':'b'}">`+
    `${m.side==='R'?'\u7ea2':'\u9ed1'}</td><td>${m.engname}</td>`+
    `<td>${m.text}</td><td>${m.score}</td><td>${m.t}</td>`;
  tb.appendChild(tr);});
document.onkeydown=e=>{if(e.key==='ArrowLeft')step(-1);
  if(e.key==='ArrowRight')step(1);};
draw();
</script></body></html>
