<html lang="zh"><head><meta charset="utf-8">

<style>

</style></head><body><div class="wrap">
<h1>棋王 ROM AI &nbsp;vs&nbsp; Pikafish (10 ms, 1T)</h1>
<div class="sub">Pikafish 执黑让子 [b9, h9] · 无铁兵等补偿规则 · ROM depth 6 执红 · 47 ply</div>
<div class="main">
 <div>
  <canvas id="cv" width="450" height="500"></canvas>
  <div class="ctl">
   <button onclick="go(0)">⏮</button><button onclick="step(-1)">◀</button>
   <button id="pp" onclick="play()">▶ 播放</button>
   <button onclick="step(1)">▶</button><button onclick="go(MOVES.length)">⏭</button>
  </div>
  <input type="range" id="sl" min="0" max="47" value="0"
         oninput="go(+this.value)" style="width:100%">
 </div>
 <div class="side">
  <div class="status" id="st"></div>
  <div class="scroll"><table><thead><tr><th>#</th><th>方</th><th>引擎</th>
  <th>走法</th><th>评分</th><th>用时</th></tr></thead>
  <tbody id="tb"></tbody></table></div>
 </div>
</div></div>
<script>
const MOVES=[{"frm": 86, "to": 50, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "炮 h2-e2", "score": 192, "t": 19.062}, {"frm": 81, "to": 55, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "象 g9-e7", "score": -465, "t": 0.01}, {"frm": 84, "to": 74, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "马 h0-g2", "score": 201, "t": 21.689}, {"frm": 9, "to": 8, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "車 a9-a8", "score": -457, "t": 0.011}, {"frm": 12, "to": 26, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "马 b0-c2", "score": 202, "t": 27.689}, {"frm": 8, "to": 68, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "車 a8-f8", "score": -466, "t": 0.01}, {"frm": 0, "to": 1, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "车 a0-a1", "score": 208, "t": 44.177}, {"frm": 69, "to": 56, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "士 f9-e8", "score": -483, "t": 0.012}, {"frm": 1, "to": 37, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "车 a1-d1", "score": 216, "t": 10.286}, {"frm": 68, "to": 62, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "車 f8-f2", "score": -421, "t": 0.012}, {"frm": 96, "to": 98, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "车 i0-i2", "score": 219, "t": 16.414}, {"frm": 105, "to": 69, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "車 i9-f9", "score": -468, "t": 0.013}, {"frm": 27, "to": 28, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "兵 c3-c4", "score": 216, "t": 23.628}, {"frm": 62, "to": 65, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "車 f2-f5", "score": -464, "t": 0.01}, {"frm": 14, "to": 2, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "炮 b2-a2", "score": 216, "t": 95.05}, {"frm": 30, "to": 29, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T 3, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "車 f9-h9", "score": -538, "t": 0.011}, {"frm": 37, "to": 42, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "车 d1-d6", "score": 351, "t": 6.816}, {"frm": 67, "to": 79, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "砲 f7-g7", "score": -547, "t": 0.01}, {"frm": 98, "to": 97, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "车 i2-i1", "score": 355, "t": 6.327}, {"frm": 93, "to": 69, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "車 h9-f9", "score": -603, "t": 0.011}, {"frm": 97, "to": 37, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "车 i1-d1", "score": 355, "t": 9.444}, {"frm": 79, "to": 43, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "砲 g7-d7", "score": -630, "t": 0.011}, {"frm": 42, "to": 43, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "车 d6xd7 (砲)", "score": 357, "t": 7.067}, {"frm": 29, "to": 55, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "象 c5-e7", "score": -659, "t": 0.013}, {"frm": 43, "to": 55, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "车 d7xe7 (象)", "score": 466, "t": 13.504}, {"frm": 102, "to": 101, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "卒 i6-i5", "score": -696, "t": 0.011}, {"frm": 55, "to": 43, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "车 e7-d7", "score": 505, "t": 19.421}, {"frm": 69, "to": 60, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "車 f9xf0 (仕)", "score": -840, "t": 0.01}, {"frm": 48, "to": 60, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "帅 e0xf0 (車)", "score": 464, "t": 1.824}, {"frm": 101, "to": 100, "side": "B", "eng": "modern", "engname": "Pikafish (10 ms, 1T)", "text": "卒 i5-i4", "score": -840, "t": 0.005}, {"frm": 43, "to": 45, "side": "R", "eng": "rom", "engname": "ROM depth 6", "text": "车 d7xd9 (士)", "score": 682, "t": 20.541}], START={"48": [1, 0], "96": [4, 0], "0": [4, 0], "86": [6, 0], "14": [6, 0], "84": [5, 0], "12": [5, 0], "60": [2, 0], "36": [2, 0], "72": [3, 0], "24": [3, 0], "99": [7, 0], "75": [7, 0], "51": [7, 0], "27": [7, 0], "3": [7, 0], "57": [1, 1], "105": [4, 1], "9": [4, 1], "91": [6, 1], "19": [6, 1], "69": [2, 1], "45": [2, 1], "81": [3, 1], "33": [3, 1], "102": [7, 1], "78": [7, 1], "54": [7, 1], "30": [7, 1], "6": [7, 1]}, RESULT="rom wins: checkmate";
const CN={1:'\u5e05',2:'\u4ed5',3:'\u76f8',4:'\u8f66',5:'\u9a6c',6:'\u70ae',7:'\u5175'};
const CNB={1:'\u5c06',2:'\u58eb',3:'\u8c61',4:'\u8eca',5:'\u99ac',6:'\u7832',7:'\u5352'};
const M=30, CELL=48, cv=document.getElementById('cv'), cx=cv.getContext('2d');
let idx=0, timer=null;

function boardAt(n){
  let b=JSON.parse(JSON.stringify(START));
  for(let i=0;i<n;i++){const m=MOVES[i]; b[m.to]=b[m.frm]; delete b[m.frm];}
  return b;
}
function xy(pos){return [M+Math.floor(pos/12)*CELL, M+(9-(pos%12))*CELL];}

function draw(){
  const b=boardAt(idx);
  cx.fillStyle='#f0d9a7';cx.fillRect(0,0,cv.width,cv.height);
  cx.strokeStyle='#7a5c33';cx.lineWidth=1;
  for(let r=0;r<10;r++){cx.beginPath();cx.moveTo(M,M+r*CELL);
    cx.lineTo(M+8*CELL,M+r*CELL);cx.stroke();}
  for(let f=0;f<9;f++){
    if(f===0||f===8){cx.beginPath();cx.moveTo(M+f*CELL,M);
      cx.lineTo(M+f*CELL,M+9*CELL);cx.stroke();}
    else{cx.beginPath();cx.moveTo(M+f*CELL,M);cx.lineTo(M+f*CELL,M+4*CELL);cx.stroke();
      cx.beginPath();cx.moveTo(M+f*CELL,M+5*CELL);cx.lineTo(M+f*CELL,M+9*CELL);cx.stroke();}}
  cx.beginPath();cx.moveTo(M+3*CELL,M);cx.lineTo(M+5*CELL,M+2*CELL);
  cx.moveTo(M+5*CELL,M);cx.lineTo(M+3*CELL,M+2*CELL);
  cx.moveTo(M+3*CELL,M+7*CELL);cx.lineTo(M+5*CELL,M+9*CELL);
  cx.moveTo(M+5*CELL,M+7*CELL);cx.lineTo(M+3*CELL,M+9*CELL);cx.stroke();
  cx.fillStyle='#8a6a3d';cx.font='16px serif';cx.textAlign='center';
  cx.fillText('\u695a\u6cb3          \u6f22\u754c', M+4*CELL, M+4.6*CELL);

  if(idx>0){const m=MOVES[idx-1];
    for(const p of [m.frm,m.to]){const [x,y]=xy(p);
      cx.fillStyle='rgba(255,200,0,.45)';cx.beginPath();
      cx.arc(x,y,CELL*0.44,0,7);cx.fill();}}

  for(const k in b){const [t,s]=b[k], [x,y]=xy(+k);
    cx.beginPath();cx.arc(x,y,CELL*0.40,0,7);
    cx.fillStyle=s===0?'#fff4e0':'#3b3b3b';cx.fill();
    cx.lineWidth=2;cx.strokeStyle=s===0?'#c0392b':'#1a1a1a';cx.stroke();
    cx.fillStyle=s===0?'#c0392b':'#7fb3ff';
    cx.font='bold 24px "PingFang SC","Microsoft YaHei",serif';
    cx.textBaseline='middle';cx.fillText(s===0?CN[t]:CNB[t],x,y+1);}

  document.getElementById('sl').value=idx;
  const st=document.getElementById('st');
  if(idx===0) st.textContent='\u521d\u59cb\u5c40\u9762';
  else{const m=MOVES[idx-1];
    st.innerHTML=`<span class="badge ${m.eng==='rom'?'rom':'mod'}">${m.engname}</span> `+
      `<b>${m.text}</b> &nbsp;<span style="color:#9aa0a6">${m.score} · ${m.t}s</span>`;}
  if(idx===MOVES.length&&RESULT) st.innerHTML+=`<br><b>${RESULT}</b>`;
  document.querySelectorAll('#tb tr').forEach((r,i)=>
    r.className=(i===idx-1)?'on':'');
  const cur=document.querySelector('#tb tr.on'); if(cur) cur.scrollIntoView({block:'nearest'});
}
function go(n){idx=Math.max(0,Math.min(MOVES.length,n));draw();}
function step(d){go(idx+d);}
function play(){
  const btn=document.getElementById('pp');
  if(timer){clearInterval(timer);timer=null;btn.textContent='\u25b6 \u64ad\u653e';return;}
  btn.textContent='\u23f8 \u6682\u505c';
  timer=setInterval(()=>{if(idx>=MOVES.length){clearInterval(timer);timer=null;
    btn.textContent='\u25b6 \u64ad\u653e';}else step(1);},750);
}
const tb=document.getElementById('tb');
MOVES.forEach((m,i)=>{const tr=document.createElement('tr');
  tr.onclick=()=>go(i+1);
  tr.innerHTML=`<td>${i+1}</td><td class="${m.side==='R'?'r':'b'}">`+
    `${m.side==='R'?'\u7ea2':'\u9ed1'}</td><td>${m.engname}</td>`+
    `<td>${m.text}</td><td>${m.score}</td><td>${m.t}</td>`;
  tb.appendChild(tr);});
document.onkeydown=e=>{if(e.key==='ArrowLeft')step(-1);
  if(e.key==='ArrowRight')step(1);};
draw();
</script></body></html>
